name: CI/CD - Cidades ESGInteligentes

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true

jobs:
  # ------------------------------------------------------------------
  # 1) BUILD + TESTES AUTOMATIZADOS
  # ------------------------------------------------------------------
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore src/Fiap.Api.Reciclagem.Tests/Fiap.Api.Reciclagem.Tests.csproj
      - name: Build
        run: dotnet build src/Fiap.Api.Reciclagem.Tests/Fiap.Api.Reciclagem.Tests.csproj -c Release --no-restore
      - name: Test (xUnit)
        run: >
          dotnet test src/Fiap.Api.Reciclagem.Tests/Fiap.Api.Reciclagem.Tests.csproj
          -c Release --no-build --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults
      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

  # ------------------------------------------------------------------
  # 2) BUILD E PUBLICACAO DA IMAGEM DOCKER (GitHub Container Registry)
  # ------------------------------------------------------------------
  docker:
    name: Docker image
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: Nome da imagem (minusculo)
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fiap-api-reciclagem" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:${{ github.ref_name == 'main' && 'latest' || 'develop' }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # 3) DEPLOY EM STAGING (Azure App Service) - push em develop ou main
  # ------------------------------------------------------------------
  deploy-staging:
    name: Deploy staging (Azure)
    needs: docker
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_APP_STAGING }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_STAGING }}
          images: ${{ needs.docker.outputs.image }}:${{ github.sha }}
      - name: Smoke test
        run: |
          BASE="${{ steps.deploy.outputs.webapp-url }}"; BASE="${BASE%/}"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/health" || true)
            [ "$code" = "200" ] && break
            echo "tentativa $i: /health -> $code"; sleep 10
          done
          [ "$code" = "200" ] || { echo "Health check falhou"; exit 1; }
          curl -fsS "$BASE/api/PontoColeta" > /dev/null
          curl -fsS -X POST "$BASE/api/Auth/login" -H 'Content-Type: application/json' \
            -d '{"username":"gestor01","password":"pass123"}' > /dev/null
          echo "Smoke test OK em $BASE"

  # ------------------------------------------------------------------
  # 4) DEPLOY EM PRODUCAO (Azure App Service) - somente main
  #    Se o Environment "production" tiver Required reviewers, aguarda aprovacao.
  # ------------------------------------------------------------------
  deploy-production:
    name: Deploy producao (Azure)
    needs: [docker, deploy-staging]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_APP_PRODUCTION }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_PRODUCTION }}
          images: ${{ needs.docker.outputs.image }}:${{ github.sha }}
      - name: Smoke test
        run: |
          BASE="${{ steps.deploy.outputs.webapp-url }}"; BASE="${BASE%/}"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/health" || true)
            [ "$code" = "200" ] && break
            echo "tentativa $i: /health -> $code"; sleep 10
          done
          [ "$code" = "200" ] || { echo "Health check falhou"; exit 1; }
          curl -fsS "$BASE/api/PontoColeta" > /dev/null
          curl -fsS -X POST "$BASE/api/Auth/login" -H 'Content-Type: application/json' \
            -d '{"username":"gestor01","password":"pass123"}' > /dev/null
          echo "Smoke test OK em $BASE"
